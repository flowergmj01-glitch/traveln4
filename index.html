            // Theme colors mapping
            const colors = {
                1: { bg: 'bg-pink-50', border: 'border-pink-200', tag: 'bg-pink-500', text: 'text-pink-700', leftBorder: 'border-pink-400', eBg: 'bg-pink-100/50' },
                2: { bg: 'bg-blue-50', border: 'border-blue-200', tag: 'bg-blue-500', text: 'text-blue-700', leftBorder: 'border-blue-400', eBg: 'bg-blue-100/50' }
            };
            const c = colors[theme];

            return (
              <div className={`flex-1 ${c.bg} rounded-2xl p-5 border-2 ${c.border} shadow-sm flex flex-col relative overflow-hidden`}>
                <div className="flex items-baseline gap-3 mb-3 z-10">
                  <span className={`${c.tag} text-white text-xs px-3 py-1 rounded-full shadow-sm font-bold tracking-wider`}>單字 {num}</span>
                  <h3 className={`text-4xl font-black ${c.text}`}>{parseFurigana(data.w)}</h3>
                  <span className="text-gray-600 text-[1.5rem] ml-auto font-bold bg-white px-3 py-1 rounded-xl shadow-sm">{data.m}</span>
                </div>
                <div className="flex-1 flex flex-col justify-center space-y-3 mt-1 z-10">
                  <div className={`border-l-4 ${c.leftBorder} pl-4 py-1`}>
                    <p className="text-[1.15rem] text-gray-800 font-bold tracking-wide">{parseFurigana(data.e1)}</p>
                    <p className="text-[1.15rem] text-gray-600 mt-1 font-bold">{data.m1}</p>
                  </div>
                  <div className={`border-l-4 ${c.leftBorder} pl-4 ${c.eBg} py-2 pr-2 rounded-r-xl`}>
                    <p className="text-[1.15rem] text-gray-800 font-bold tracking-wide">{parseFurigana(data.e2)}</p>
                    <p className="text-[1.15rem] text-gray-600 mt-1 font-bold">{data.m2}</p>
                  </div>
                </div>
              </div>
            );
        };

        // === 內容頁元件 ===
        const ContentPage = ({ data }) => (
          <div className="a4-landscape bg-white flex flex-col relative border-4 border-gray-100">
            {/* Background Emojis for the page */}
            {data.bgEmojis && data.bgEmojis.map((emoji, index) => (
                <div key={index} className={`bg-emoji ${index === 0 ? 'top-6 left-6 rotate-12' : index === 1 ? 'bottom-6 right-6 -rotate-12' : 'top-1/2 left-1/2 opacity-5'}`} style={{fontSize: index===2?'10rem':'3rem', zIndex: 0}}>
                    {emoji}
                </div>
            ))}

            {/* Header */}
            <div className="flex justify-between items-end border-b-4 border-yellow-300 pb-3 mb-5 shrink-0 z-10">
              <h2 className="text-2xl font-black text-orange-600 flex items-center bg-orange-50 px-4 py-1 rounded-t-xl">
                <span className="text-3xl mr-2">🍱</span> 中高階日語：日本美食購物樂透透
              </h2>
              <div className="text-yellow-800 font-black bg-yellow-200 px-5 py-1.5 rounded-full shadow-sm text-lg">
                Page {data.p}
              </div>
            </div>

            {/* Content: Vocab Row */}
            <div className="flex gap-5 mb-5 flex-1 h-[48%] z-10">
              <VocabCard data={data.v1} num={1} theme={1} />
              <VocabCard data={data.v2} num={2} theme={2} />
            </div>

            {/* Content: Grammar & Quiz Row */}
            <div className="flex gap-5 flex-1 h-[40%] mb-2 z-10">
              {/* Grammar Card */}
              <div className="flex-[3] bg-yellow-50 rounded-2xl p-5 border-2 border-yellow-200 flex flex-col shadow-sm relative overflow-hidden">
                <div className="flex items-baseline gap-3 mb-3">
                  <span className="bg-yellow-500 text-white text-xs px-3 py-1 rounded-full font-bold shadow-sm">核心文法</span>
                  <h3 className="text-3xl font-black text-yellow-800">{data.g.p}</h3>
                  <span className="text-gray-600 text-xl ml-auto font-bold bg-white px-3 py-1 rounded-xl shadow-sm">{data.g.m}</span>
                </div>
                <div className="flex-1 flex flex-col justify-center space-y-4 bg-white/60 p-4 rounded-xl border border-yellow-100">
                  <div className="pl-2">
                    <p className="text-[1.15rem] text-gray-800 font-bold"><span className="text-yellow-600 mr-2">✦</span>{parseFurigana(data.g.e1)}</p>
                    <p className="text-[1.15rem] text-gray-600 ml-6 mt-1 font-bold">{data.g.m1}</p>
                  </div>
                  <div className="pl-2">
                    <p className="text-[1.15rem] text-gray-800 font-bold"><span className="text-yellow-600 mr-2">✦</span>{parseFurigana(data.g.e2)}</p>
                    <p className="text-[1.15rem] text-gray-600 ml-6 mt-1 font-bold">{data.g.m2}</p>
                  </div>
                </div>
              </div>

              {/* Quiz Card */}
              <div className="flex-[2] bg-purple-50 rounded-2xl p-5 border-2 border-purple-200 flex flex-col shadow-sm relative">
                <div className="mb-3">
                  <span className="bg-purple-500 text-white text-xs px-3 py-1 rounded-full font-bold shadow-sm">
                    實戰測驗 {data.q.t === "sort" ? "✨ (排序題)" : "🎯"}
                  </span>
                </div>
                <div className="flex-1 flex flex-col justify-center">
                  <p className="text-[1.15rem] font-bold text-gray-800 mb-5 leading-relaxed">{parseFurigana(data.q.text)}</p>
                  
                  {data.q.t === "normal" ? (
                    <div className="grid grid-cols-1 gap-2">
                      {data.q.c.map((choice, i) => (
                        <div key={i} className="text-[1.15rem] border border-purple-200 rounded-lg p-2 pl-4 bg-white shadow-sm font-bold text-gray-700 flex items-center">
                          <span className="bg-purple-100 text-purple-700 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-3 font-bold">{i + 1}</span> 
                          {parseFurigana(choice)}
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="flex flex-wrap gap-2 mt-2">
                      {data.q.c.map((choice, i) => (
                        <div key={i} className="text-[1.15rem] border-2 border-purple-200 rounded-xl px-4 py-2 bg-white shadow-sm font-bold text-gray-800 flex items-center">
                          <span className="mr-2 text-purple-400 font-black">{i + 1}.</span> {parseFurigana(choice)}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="absolute bottom-3 right-4 text-sm font-black text-purple-300">
                  Ans: {data.q.ans}
                </div>
              </div>
            </div>
          </div>
        );

        // === 主程式 ===
        function App() {
          return (
            <div className="min-h-screen py-8 flex flex-col items-center">
              {/* 懸浮列印按鈕 */}
              <button 
                onClick={() => window.print()} 
                className="fixed top-6 right-6 bg-pink-500 text-white px-6 py-3 rounded-full shadow-2xl hover:bg-pink-600 transition-colors font-bold text-lg flex items-center gap-2 z-50 no-print border-2 border-white"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                列印 / 輸出 PDF
              </button>

              <div className="mb-6 text-gray-500 font-bold no-print text-center bg-white px-6 py-3 rounded-full shadow-sm">
                ⬇️ 往下滑動預覽所有頁面，點擊右上角按鈕即可列印彩色講義 ⬇️
              </div>
              
              {/* 封面 */}
              <CoverPage />

              {/* 20 頁內容 */}
              {pageData.map(data => (
                <ContentPage key={`page-${data.p}`} data={data} />
              ))}
            </div>
          );
        }

        // === 渲染至 DOM ===
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
